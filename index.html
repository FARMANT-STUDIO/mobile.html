<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HORROR MINI MOBILE ALPHA 0.05</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; touch-action: none; }
        #menu {
            position: fixed; inset: 0; background: radial-gradient(circle, #220000 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        #title { color: #ff0000; font-size: clamp(32px, 8vw, 80px); font-weight: 900; text-shadow: 4px 4px #000; margin: 0; }
        #version { color: #fff; font-size: 14px; margin-bottom: 30px; letter-spacing: 5px; }
        #btn-create {
            padding: 15px 40px; font-size: 20px; color: white; background: transparent;
            border: 3px solid white; cursor: pointer; border-radius: 4px; transition: 0.3s;
        }
        #ui-overlay {
            position: fixed; top: 10px; left: 10px; color: white; font-size: 10px; display: none; z-index: 50; width: 100%;
        }
        #gpu-monitor {
            position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8);
            border: 1px solid #00ff00; padding: 5px; color: #00ff00; font-size: 9px; display: none;
        }
        
        /* MOBİL KONTROLLER */
        #mobile-controls {
            position: fixed; bottom: 20px; left: 20px; display: none; grid-template-columns: repeat(3, 60px); gap: 10px; z-index: 70;
        }
        .touch-btn {
            width: 60px; height: 60px; background: rgba(255,255,255,0.2); border: 2px solid #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 10px; border-radius: 10px; -webkit-user-select: none;
        }
        .touch-btn:active { background: rgba(255,255,255,0.5); }
        .arrow { font-size: 24px; font-weight: bold; }
        
        #jump-btn {
            position: fixed; bottom: 40px; right: 80px; width: 70px; height: 70px;
            background: rgba(255,0,0,0.3); border: 2px solid white; border-radius: 50%;
            display: none; align-items: center; justify-content: center; color: white; z-index: 70;
        }
        #sprint-btn {
            position: fixed; bottom: 100px; left: 230px; width: 60px; height: 60px;
            background: rgba(255,136,0,0.3); border: 2px solid #ff8800; border-radius: 10px;
            display: none; align-items: center; justify-content: center; color: white; font-size: 10px; z-index: 70;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1 id="title">HORROR MINI</h1>
        <div id="version">ALPHA 0.05</div>
        <button id="btn-create">DÜNYA OLUŞTUR</button>
    </div>

    <div id="ui-overlay">
        <div style="color: #00ffff; font-weight: bold; font-size: 14px;">MOBİLE İÇİN UYUMLU</div>
        <span>DEV: STRLXY-B9Q</span>
    </div>

    <div id="mobile-controls">
        <div></div>
        <div class="touch-btn" id="btn-up"><span class="arrow">↑</span><span>İLERİ</span></div>
        <div></div>
        <div class="touch-btn" id="btn-left"><span class="arrow">←</span><span>SOLA</span></div>
        <div class="touch-btn" id="btn-down"><span class="arrow">↓</span><span>GERİ</span></div>
        <div class="touch-btn" id="btn-right"><span class="arrow">→</span><span>SAĞA</span></div>
    </div>

    <div id="sprint-btn">HIZLI KOŞ</div>
    <div id="jump-btn">ZIPLA</div>

    <div id="gpu-monitor">
        <div>GPU: <span id="gpu-load">0%</span></div>
        <div>STATUS: <span id="aux-status">READY</span></div>
    </div>

    <script>
        let scene, camera, renderer, simplex, worldSeed;
        let clock = new THREE.Clock();
        const CHUNK_SIZE = 10; // Mobil performans için biraz küçültüldü
        const VIEW_DISTANCE = 2; 
        const SEA_LEVEL = 23;
        const worldBlocks = new Map();
        const chunkMeshes = new Map();
        
        const player = {
            pos: new THREE.Vector3(0, 40, 0),
            vel: new THREE.Vector3(0, 0, 0),
            speed: 0.12,
            sprintMultiplier: 1,
            jumpForce: 0.18,
            onGround: false,
            height: 1.8,
            radius: 0.4
        };

        const keys = {};
        let touchX = null, touchY = null;

        document.getElementById('btn-create').addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });
        document.getElementById('btn-create').addEventListener('click', startGame);

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('gpu-monitor').style.display = 'block';
            document.getElementById('mobile-controls').style.display = 'grid';
            document.getElementById('jump-btn').style.display = 'flex';
            document.getElementById('sprint-btn').style.display = 'flex';
            initGame();
        }

        function initGame() {
            worldSeed = Math.floor(Math.random() * 9000000);
            simplex = new SimplexNoise(worldSeed.toString());

            scene = new THREE.Scene();
            const skyColor = 0x111115;
            scene.background = new THREE.Color(skyColor);
            scene.fog = new THREE.Fog(skyColor, 2, 30);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const sun = new THREE.PointLight(0xffffff, 0.8, 50);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0x404040, 0.5));

            initMaterials();
            
            player.pos.set(0, getTerrainHeight(0, 0) + 2, 0);

            // Mobil Dokunmatik Eventleri
            setupMobileEvents();
            
            requestAnimationFrame(animate);
        }

        function setupMobileEvents() {
            const bindBtn = (id, key) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            };

            bindBtn('btn-up', 'KeyW');
            bindBtn('btn-down', 'KeyS');
            bindBtn('btn-left', 'KeyA');
            bindBtn('btn-right', 'KeyD');
            bindBtn('jump-btn', 'Space');
            
            const sBtn = document.getElementById('sprint-btn');
            sBtn.addEventListener('touchstart', (e) => { e.preventDefault(); player.sprintMultiplier = 2.0; sBtn.style.background = "orange"; });
            sBtn.addEventListener('touchend', (e) => { e.preventDefault(); player.sprintMultiplier = 1.0; sBtn.style.background = "rgba(255,136,0,0.3)"; });

            // Ekran Kaydırma (Bakış)
            window.addEventListener('touchstart', e => {
                if(e.target.tagName !== 'BUTTON' && !e.target.closest('.touch-btn')) {
                    touchX = e.touches[0].pageX;
                    touchY = e.touches[0].pageY;
                }
            });

            window.addEventListener('touchmove', e => {
                if(touchX !== null && e.target.tagName !== 'BUTTON') {
                    const dx = e.touches[0].pageX - touchX;
                    const dy = e.touches[0].pageY - touchY;
                    camera.rotation.y -= dx * 0.005;
                    camera.rotation.x -= dy * 0.005;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                    touchX = e.touches[0].pageX;
                    touchY = e.touches[0].pageY;
                }
            });

            window.addEventListener('touchend', () => { touchX = null; touchY = null; });
        }

        let matList;
        function initMaterials() {
            const grassTop = new THREE.MeshLambertMaterial({color: 0x2d5e2d});
            const dirt = new THREE.MeshLambertMaterial({color: 0x5D2906});
            matList = {
                grass: [dirt, dirt, grassTop, dirt, dirt, dirt],
                dirt: dirt,
                stone: new THREE.MeshLambertMaterial({color: 0x444444}),
                water: new THREE.MeshLambertMaterial({color: 0x001133, transparent: true, opacity: 0.7})
            };
        }

        function getTerrainHeight(x, z) {
            return Math.floor(25 + simplex.noise2D(x * 0.05, z * 0.05) * 8);
        }

        function createChunk(cx, cz) {
            const key = `${cx},${cz}`;
            if (chunkMeshes.has(key)) return;

            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const blocks = { grass: [], dirt: [], stone: [] };

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const wx = cx * CHUNK_SIZE + x;
                    const wz = cz * CHUNK_SIZE + z;
                    const h = getTerrainHeight(wx, wz);

                    blocks.grass.push(new THREE.Vector3(wx, h, wz));
                    setBlock(wx, h, wz, 'grass');
                    
                    for(let y = 1; y < 3; y++) {
                        blocks.dirt.push(new THREE.Vector3(wx, h-y, wz));
                        setBlock(wx, h-y, wz, 'dirt');
                    }
                }
            }

            Object.keys(blocks).forEach(type => {
                const list = blocks[type];
                const inst = new THREE.InstancedMesh(geo, type === 'grass' ? matList.grass : matList[type], list.length);
                const mat = new THREE.Matrix4();
                list.forEach((pos, i) => {
                    mat.setPosition(pos);
                    inst.setMatrixAt(i, mat);
                });
                group.add(inst);
            });

            scene.add(group);
            chunkMeshes.set(key, group);
        }

        function setBlock(x, y, z, type) {
            worldBlocks.set(`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`, type);
        }

        function getBlock(x, y, z) {
            return worldBlocks.get(`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`);
        }

        function checkCollision(x, y, z) {
            const h = player.height;
            for (let oy = 0.2; oy <= h; oy += h/2) {
                if (getBlock(x, y + oy, z)) return true;
            }
            return false;
        }

        function updatePhysics() {
            player.vel.y -= 0.01;
            const moveDir = new THREE.Vector3();
            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;
            
            moveDir.applyQuaternion(camera.quaternion);
            moveDir.y = 0;
            moveDir.normalize();

            let curSpeed = player.speed * player.sprintMultiplier;
            const nextX = player.pos.x + moveDir.x * curSpeed;
            const nextZ = player.pos.z + moveDir.z * curSpeed;

            if (!checkCollision(nextX, player.pos.y, player.pos.z)) player.pos.x = nextX;
            if (!checkCollision(player.pos.x, player.pos.y, nextZ)) player.pos.z = nextZ;

            const nextY = player.pos.y + player.vel.y;
            if (checkCollision(player.pos.x, nextY, player.pos.z)) {
                if (player.vel.y < 0) player.onGround = true;
                player.vel.y = 0;
            } else {
                player.pos.y = nextY;
                player.onGround = false;
            }

            if (keys['Space'] && player.onGround) player.vel.y = player.jumpForce;

            camera.position.copy(player.pos).y += 1.6;
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();

            const px = Math.floor(player.pos.x / CHUNK_SIZE);
            const pz = Math.floor(player.pos.z / CHUNK_SIZE);

            for (let x = px - VIEW_DISTANCE; x <= px + VIEW_DISTANCE; x++) {
                for (let z = pz - VIEW_DISTANCE; z <= pz + VIEW_DISTANCE; z++) {
                    createChunk(x, z);
                }
            }

            document.getElementById('gpu-load').innerText = renderer.info.render.calls;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
