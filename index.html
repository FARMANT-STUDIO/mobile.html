    <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HORROR MINI ALPHA 0.05 - MOBILE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; touch-action: none; }
        #menu {
            position: fixed; inset: 0; background: radial-gradient(circle, #220000 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        #title { color: #ff0000; font-size: clamp(48px, 10vw, 80px); font-weight: 900; text-shadow: 4px 4px #000; margin: 0; }
        #version { color: #fff; font-size: 18px; margin-bottom: 30px; letter-spacing: 5px; }
        #btn-create {
            padding: 15px 40px; font-size: 20px; color: white; background: transparent;
            border: 3px solid white; cursor: pointer; border-radius: 4px; transition: 0.3s;
        }
        #btn-create:hover { background: white; color: black; }
        #ui-overlay {
            position: fixed; top: 10px; left: 10px; color: white; font-size: 12px; display: none; z-index: 50; width: 100%;
        }
        #gpu-monitor {
            position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8);
            border: 1px solid #00ff00; padding: 10px; color: #00ff00; font-size: 10px; display: none;
        }
        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 24px; pointer-events: none; display: none; z-index: 60;
        }

        /* MOBILE CONTROLS STYLES */
        #mobile-controls {
            position: fixed; bottom: 40px; left: 40px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%; display: none; z-index: 70;
            border: 2px solid rgba(255,255,255,0.2);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.4); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #action-buttons {
            position: fixed; bottom: 40px; right: 40px; display: none;
            flex-direction: column; gap: 15px; z-index: 70;
        }
        .mobile-btn {
            width: 70px; height: 70px; background: rgba(255, 0, 0, 0.2);
            border: 2px solid white; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1 id="title">HORROR MINI</h1>
        <div id="version">ALPHA 0.05</div>
        <button id="btn-create">DÜNYA OLUŞTUR</button>
    </div>

    <div id="ui-overlay">
        <span>THE GAME'S DEVELOPER IS STRLXY-B9Q. DO NOT CHANGE IT.</span>
        <span style="margin-left: 20px; color: #ff8800; font-weight: bold;">ALPHA 0.05</span>
    </div>

    <div id="crosshair">+</div>

    <div id="gpu-monitor">
        <div>PRIMARY GPU: <span id="gpu-load">0%</span></div>
        <div>AUXILIARY GPU: <span id="aux-status" style="color:#00ffff">READY</span></div>
    </div>

    <!-- Mobile UI Elements -->
    <div id="mobile-controls">
        <div id="joystick-stick"></div>
    </div>
    <div id="action-buttons">
        <div id="btn-shift" class="mobile-btn">SHIFT</div>
        <div id="btn-space" class="mobile-btn">SPACE</div>
    </div>

    <script>
        let scene, camera, renderer, simplex, worldSeed;
        let clock = new THREE.Clock();
        const CHUNK_SIZE = 13;
        const VIEW_DISTANCE = 3; 
        const SEA_LEVEL = 23;
        const worldBlocks = new Map();
        const chunkMeshes = new Map();
        let clouds = [];
        
        const player = {
            pos: new THREE.Vector3(0, 40, 0),
            vel: new THREE.Vector3(0, 0, 0),
            speed: 0.12,
            jumpForce: 0.18,
            onGround: false,
            inWater: false,
            height: 1.8,
            radius: 0.3
        };

        const keys = {};
        
        // Mobile State Variables
        let joystickActive = false;
        let mobileMoveDir = { x: 0, z: 0 };
        let isRunning = false;
        let touchLookId = null;
        let lastTouchX, lastTouchY;

        document.getElementById('btn-create').addEventListener('click', () => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('gpu-monitor').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            
            // Show mobile UI if touch device
            if ('ontouchstart' in window) {
                document.getElementById('mobile-controls').style.display = 'block';
                document.getElementById('action-buttons').style.display = 'flex';
            }
            
            initGame();
        });

        function initGame() {
            worldSeed = Math.floor(Math.random() * 9000000) + 1000000;
            simplex = new SimplexNoise(worldSeed.toString());

            scene = new THREE.Scene();
            const skyColor = 0x556677; 
            scene.background = new THREE.Color(skyColor);
            scene.fog = new THREE.Fog(skyColor, 5, CHUNK_SIZE * VIEW_DISTANCE);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.5 : 1);
            document.body.appendChild(renderer.domElement);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(0, 100, 0);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            initMaterials();
            initClouds();
            
            const startY = getTerrainHeight(0, 0);
            player.pos.set(0, startY + 2, 0);

            // Desktop Events
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            document.addEventListener('mousemove', onMouseMove);
            document.body.addEventListener('click', () => {
                if (!('ontouchstart' in window)) document.body.requestPointerLock();
            });

            // Mobile Events
            setupMobileEvents();
            
            window.addEventListener('resize', onWindowResize);
            requestAnimationFrame(animate);
        }

        function setupMobileEvents() {
            const joystick = document.getElementById('mobile-controls');
            const stick = document.getElementById('joystick-stick');
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            joystick.addEventListener('touchstart', (e) => {
                joystickActive = true;
            }, {passive: false});

            window.addEventListener('touchmove', (e) => {
                if (joystickActive) {
                    let touch = Array.from(e.touches).find(t => t.clientX < window.innerWidth / 2);
                    if (touch) {
                        let dx = touch.clientX - centerX;
                        let dy = touch.clientY - centerY;
                        let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
                        let angle = Math.atan2(dy, dx);
                        
                        stick.style.transform = `translate(calc(-50% + ${dx * (dist/50)}px), calc(-50% + ${dy * (dist/50)}px))`;
                        
                        mobileMoveDir.x = Math.cos(angle) * (dist / 50);
                        mobileMoveDir.z = Math.sin(angle) * (dist / 50);
                    }
                }

                // Look around
                let lookTouch = Array.from(e.touches).find(t => t.clientX > window.innerWidth / 2);
                if (lookTouch) {
                    if (touchLookId === null) {
                        touchLookId = lookTouch.identifier;
                        lastTouchX = lookTouch.clientX;
                        lastTouchY = lookTouch.clientY;
                    } else if (lookTouch.identifier === touchLookId) {
                        let dx = lookTouch.clientX - lastTouchX;
                        let dy = lookTouch.clientY - lastTouchY;
                        camera.rotation.y -= dx * 0.006;
                        camera.rotation.x -= dy * 0.006;
                        camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                        lastTouchX = lookTouch.clientX;
                        lastTouchY = lookTouch.clientY;
                    }
                }
            }, {passive: false});

            window.addEventListener('touchend', (e) => {
                let stillPointer = Array.from(e.touches).some(t => t.clientX < window.innerWidth / 2);
                if (!stillPointer) {
                    joystickActive = false;
                    mobileMoveDir = { x: 0, z: 0 };
                    stick.style.transform = `translate(-50%, -50%)`;
                }
                
                let stillLook = Array.from(e.touches).some(t => t.identifier === touchLookId);
                if (!stillLook) touchLookId = null;
            });

            // Buttons
            document.getElementById('btn-shift').addEventListener('touchstart', () => isRunning = true);
            document.getElementById('btn-shift').addEventListener('touchend', () => isRunning = false);
            document.getElementById('btn-space').addEventListener('touchstart', () => {
                if (player.onGround) player.vel.y = player.jumpForce;
                else if (player.inWater) player.vel.y = 0.05;
            });
        }

        let matList;
        function initMaterials() {
            const grassTop = new THREE.MeshLambertMaterial({color: 0x3d9e3d});
            const grassSide = new THREE.MeshLambertMaterial({color: 0xffa500}); 
            matList = {
                grass: [grassSide, grassSide, grassTop, grassSide, grassSide, grassSide],
                dirt: new THREE.MeshLambertMaterial({color: 0xffa500}), 
                stone: new THREE.MeshLambertMaterial({color: 0x777777}),
                wood: new THREE.MeshLambertMaterial({color: 0x5D2906}),
                leaf: new THREE.MeshLambertMaterial({color: 0x116611, transparent: true, opacity: 0.9}),
                water: new THREE.MeshLambertMaterial({color: 0x0044ff, transparent: true, opacity: 0.6}),
                cloud: new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.8})
            };
        }

        function getTerrainHeight(x, z) {
            const distFromCenter = Math.sqrt(x*x + z*z);
            let baseHeight = 25;
            if (distFromCenter < 12) return baseHeight;
            let noise = simplex.noise2D(x * 0.05, z * 0.05) * 12;
            return Math.floor(baseHeight + noise);
        }

        function createChunk(cx, cz) {
            const key = `${cx},${cz}`;
            if (chunkMeshes.has(key)) return;
            document.getElementById('aux-status').innerText = "CALCULATING";
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const blocks = { grass: [], dirt: [], stone: [], wood: [], leaf: [], water: [] };

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const wx = cx * CHUNK_SIZE + x;
                    const wz = cz * CHUNK_SIZE + z;
                    const h = getTerrainHeight(wx, wz);
                    if (h < SEA_LEVEL) {
                        for (let y = h + 1; y <= SEA_LEVEL; y++) {
                            setBlock(wx, y, wz, 'water');
                            blocks.water.push(new THREE.Vector3(wx, y, wz));
                        }
                    }
                    setBlock(wx, h, wz, 'grass');
                    blocks.grass.push(new THREE.Vector3(wx, h, wz));
                    for(let y = 1; y <= 5; y++) {
                        setBlock(wx, h - y, wz, 'dirt');
                        blocks.dirt.push(new THREE.Vector3(wx, h - y, wz));
                    }
                    for(let y = 6; y <= 26; y++) {
                        setBlock(wx, h - y, wz, 'stone');
                        blocks.stone.push(new THREE.Vector3(wx, h - y, wz));
                    }
                    if (Math.abs(wx) > 15 && Math.abs(wz) > 15 && h >= SEA_LEVEL && Math.random() < 0.012) {
                        for(let i = 1; i <= 7; i++) {
                            setBlock(wx, h + i, wz, 'wood');
                            blocks.wood.push(new THREE.Vector3(wx, h + i, wz));
                        }
                        for(let ly = 6; ly <= 9; ly++) {
                            for(let lx = -2; lx <= 2; lx++) {
                                for(let lz = -2; lz <= 2; lz++) {
                                    if (Math.abs(lx) + Math.abs(lz) < 3) {
                                        setBlock(wx + lx, h + ly, wz + lz, 'leaf');
                                        blocks.leaf.push(new THREE.Vector3(wx + lx, h + ly, wz + lz));
                                    }
                                }
                            }
                        }
                    }
                }
            }

            Object.keys(blocks).forEach(type => {
                const list = blocks[type];
                if (list.length === 0) return;
                const inst = new THREE.InstancedMesh(geo, type === 'grass' ? matList.grass : matList[type], list.length);
                const mat = new THREE.Matrix4();
                list.forEach((pos, i) => {
                    mat.setPosition(pos);
                    inst.setMatrixAt(i, mat);
                });
                group.add(inst);
            });

            scene.add(group);
            chunkMeshes.set(key, group);
            document.getElementById('aux-status').innerText = "IDLE";
        }

        function setBlock(x, y, z, type) {
            worldBlocks.set(`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`, type);
        }

        function getBlock(x, y, z) {
            return worldBlocks.get(`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`);
        }

        function checkCollision(x, y, z) {
            const r = player.radius;
            const h = player.height;
            for (let ox = -r; ox <= r; ox += r * 2) {
                for (let oz = -r; oz <= r; oz += r * 2) {
                    for (let oy = 0.1; oy <= h; oy += h / 2) {
                        const block = getBlock(x + ox, y + oy, z + oz);
                        if (block && block !== 'water') return true;
                    }
                }
            }
            return false;
        }

        function updatePhysics() {
            const currentBlock = getBlock(player.pos.x, player.pos.y + 0.5, player.pos.z);
            player.inWater = (currentBlock === 'water');
            let gravity = player.inWater ? 0.002 : 0.01;
            player.vel.y -= gravity;

            const moveDir = new THREE.Vector3();
            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;
            
            // Apply Mobile Joystick
            if (mobileMoveDir.x !== 0 || mobileMoveDir.z !== 0) {
                moveDir.x = mobileMoveDir.x;
                moveDir.z = mobileMoveDir.z;
            }

            if (moveDir.length() > 0) {
                let camYaw = camera.rotation.y;
                let worldX = moveDir.x * Math.cos(camYaw) + moveDir.z * Math.sin(camYaw);
                let worldZ = -moveDir.x * Math.sin(camYaw) + moveDir.z * Math.cos(camYaw);
                
                let currentSpeed = player.inWater ? player.speed * 0.5 : player.speed;
                if (keys['ShiftLeft'] || isRunning) currentSpeed *= 1.8;

                const nextX = player.pos.x + worldX * currentSpeed;
                const nextZ = player.pos.z + worldZ * currentSpeed;

                if (!checkCollision(nextX, player.pos.y, player.pos.z)) player.pos.x = nextX;
                if (!checkCollision(player.pos.x, player.pos.y, nextZ)) player.pos.z = nextZ;
            }

            const nextY = player.pos.y + player.vel.y;
            if (checkCollision(player.pos.x, nextY, player.pos.z)) {
                if (player.vel.y < 0) player.onGround = true;
                player.vel.y = 0;
            } else {
                player.pos.y = nextY;
                player.onGround = false;
            }

            if (keys['Space']) {
                if (player.onGround) player.vel.y = player.jumpForce;
                else if (player.inWater) player.vel.y = 0.05;
            }

            camera.position.copy(player.pos).y += 1.6;
        }

        function initClouds() {
            const cloudGeo = new THREE.BoxGeometry(12, 1, 12);
            for(let i = 0; i < 20; i++) {
                const cloud = new THREE.Mesh(cloudGeo, matList.cloud);
                cloud.position.set(Math.random() * 200 - 100, 50, Math.random() * 200 - 100);
                scene.add(cloud);
                clouds.push(cloud);
            }
        }

        function onMouseMove(e) {
            if (document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            const px = Math.floor(player.pos.x / CHUNK_SIZE);
            const pz = Math.floor(player.pos.z / CHUNK_SIZE);
            for (let x = px - VIEW_DISTANCE; x <= px + VIEW_DISTANCE; x++) {
                for (let z = pz - VIEW_DISTANCE; z <= pz + VIEW_DISTANCE; z++) {
                    createChunk(x, z);
                }
            }
            clouds.forEach(c => {
                c.scale.y = (player.pos.y > 20) ? 4 : 0.1;
                c.position.x += 0.01;
            });
            document.getElementById('gpu-load').innerText = Math.floor(renderer.info.render.calls / 10) + "%";
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
