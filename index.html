<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HORROR MINI - ALPHA 0.04 FULL MOBILE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #fff; touch-action: none; user-select: none; }
        canvas { filter: grayscale(1) contrast(1.4) brightness(0.7); image-rendering: pixelated; }
        
        /* --- MENÜ VE GLITCH --- */
        #glitch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; display: none; overflow: hidden; }
        .glitch-text { position: absolute; font-weight: bold; color: red; animation: blink 0.1s infinite; text-transform: uppercase; font-size: 24px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #000; z-index: 1000; border: 6px double red; box-sizing: border-box;
        }
        #logo { color: red; font-size: 35px; font-weight: bold; text-align: center; animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(1px,1px); } 50% { transform: translate(-1px,-1px); } 100% { transform: translate(1px,-1px); } }
        
        .menu-btn { background: red; color: white; border: 2px solid white; padding: 15px 45px; font-size: 22px; cursor: pointer; margin-top: 25px; }
        
        #notes-icon { position: absolute; left: 20px; bottom: 20px; font-size: 40px; cursor: pointer; z-index: 1100; filter: invert(1); }
        #notes-panel {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 350px; background: #000; border: 3px solid red; padding: 20px; z-index: 1200;
        }

        /* --- GÖRÜNÜR MOBİL KONTROLLER --- */
        #dpad {
            position: absolute; bottom: 30px; left: 30px; 
            display: none; grid-template-areas: ". up ." "left . right" ". down .";
            gap: 12px; z-index: 500;
        }
        .ctrl-btn {
            width: 75px; height: 75px; background: rgba(255, 0, 0, 0.35); 
            border: 2px solid #fff; color: white; font-weight: bold;
            display: flex; align-items: center; justify-content: center; border-radius: 12px;
            font-size: 10px; text-align: center; box-shadow: 0 0 10px rgba(255,0,0,0.3);
            active { background: rgba(255, 0, 0, 0.8); }
        }
        .btn-up { grid-area: up; }
        .btn-left { grid-area: left; }
        .btn-right { grid-area: right; }
        .btn-down { grid-area: down; }

        #action-controls {
            position: absolute; bottom: 40px; right: 30px;
            display: none; flex-direction: column; gap: 20px; z-index: 500;
        }
        .action-btn {
            width: 85px; height: 85px; border-radius: 50%;
            background: rgba(139, 0, 0, 0.6); border: 3px solid red;
            color: white; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 1px solid red; transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 45; }
    </style>
</head>
<body>

    <div id="glitch-overlay"></div>

    <div id="ui-overlay">
        <div id="logo">HORROR MINI<br><span style="font-size:16px; color:white;">ALPHA 0.04 - MOBİL</span></div>
        <button class="menu-btn" onclick="startGame()">VERİYİ KURTAR</button>
        <div id="notes-icon" onclick="toggleNotes()">📝</div>
    </div>

    <div id="notes-panel">
        <button onclick="toggleNotes()" style="float:right; background:red; border:none; color:white;">X</button>
        <h3 style="color:red;">DEVELOPER LOG</h3>
        <p>Huka her yerde. Ekranı kaydırarak etrafa bak. Sol tuşlarla yürü, sağdakilerle dünyayı değiştir. 4 chunk ötesi karanlıkta uyur.</p>
    </div>

    <!-- D-PAD -->
    <div id="dpad">
        <div class="ctrl-btn btn-up" id="btn-w">▲<br>İLERİ</div>
        <div class="ctrl-btn btn-left" id="btn-a">◀<br>SOLA</div>
        <div class="ctrl-btn btn-right" id="btn-d">▶<br>SAĞ İLERLE</div>
        <div class="ctrl-btn btn-down" id="btn-s">▼<br>ARKANA GİT</div>
    </div>

    <!-- AKSİYON -->
    <div id="action-controls">
        <div class="action-btn" id="btn-break">KIR</div>
        <div class="action-btn" id="btn-place">KOY</div>
    </div>

    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, stalker, audioCtx;
        let isGameStarted = false;
        let moveState = { w: false, a: false, s: false, d: false };
        let velocity = new THREE.Vector3(), chunks = {}, trees = [];
        const CHUNK_SIZE = 8, RENDER_DISTANCE = 4;
        const raycaster = new THREE.Raycaster();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.Fog(0x0a0a0a, 1, 18);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setPixelRatio(0.6); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.3));
            camera.position.set(0, 12, 0);
            
            spawnStalker();
            setupTouchEvents();
            animate();
        }

        function setupTouchEvents() {
            // Buton Atamaları
            const bind = (id, key) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); moveState[key] = false; });
            };
            bind('btn-w', 'w'); bind('btn-a', 'a');
            bind('btn-s', 's'); bind('btn-d', 'd');

            // Ekran Kaydırma (Bakış)
            let lastX, lastY;
            window.addEventListener('touchmove', (e) => {
                if(!isGameStarted) return;
                if(e.target.closest('.ctrl-btn') || e.target.closest('.action-btn')) return;
                
                const touch = e.touches[0];
                if (lastX !== undefined) {
                    camera.rotation.y -= (touch.clientX - lastX) * 0.007;
                    camera.rotation.x -= (touch.clientY - lastY) * 0.007;
                    camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x));
                }
                lastX = touch.clientX;
                lastY = touch.clientY;
            }, { passive: false });

            window.addEventListener('touchend', () => { lastX = undefined; lastY = undefined; });

            // Kır-Koy
            document.getElementById('btn-break').addEventListener('touchstart', (e) => { e.preventDefault(); interact(true); });
            document.getElementById('btn-place').addEventListener('touchstart', (e) => { e.preventDefault(); interact(false); });
        }

        function interact(isBreak) {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(scene.children, true);
            const target = hits.find(h => h.object !== stalker && h.distance < 4);
            if(target) {
                if(isBreak) target.object.visible = false;
                else {
                    const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color: 0x111111}));
                    b.position.copy(target.object.position).add(target.face.normal);
                    scene.add(b);
                }
            }
        }

        function createChunk(cx, cz) {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(1,1,1);
            const mat = new THREE.MeshLambertMaterial({color: 0x222222});
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const wx = cx * CHUNK_SIZE + x, wz = cz * CHUNK_SIZE + z;
                    let h = Math.floor(Math.sin(wx * 0.2) * 2 + 5);
                    const b = new THREE.Mesh(geo, mat);
                    b.position.set(wx, h, wz);
                    group.add(b);
                    if(Math.random() < 0.02) {
                        const log = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0}));
                        log.position.set(wx, h+1, wz); group.add(log);
                        trees.push({obj: log, start: Date.now()});
                    }
                }
            }
            scene.add(group); chunks[`${cx},${cz}`] = group;
        }

        function spawnStalker() {
            stalker = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.2, 0.6), new THREE.MeshBasicMaterial({color:0x000000}));
            scene.add(stalker);
            stalker.position.set(15, 10, 15);
        }

        function spawnGlitchText() {
            if(!isGameStarted) return;
            const msgs = ["HUKA", "ERROR", "DELETE", "422"];
            const div = document.createElement('div');
            div.className = 'glitch-text';
            div.innerText = msgs[Math.floor(Math.random()*msgs.length)];
            div.style.left = Math.random()*85+"%"; div.style.top = Math.random()*85+"%";
            document.getElementById('glitch-overlay').appendChild(div);
            setTimeout(() => div.remove(), 400);
        }

        function toggleNotes() { const p = document.getElementById('notes-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }

        function startGame() {
            isGameStarted = true;
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('glitch-overlay').style.display = 'block';
            document.getElementById('dpad').style.display = 'grid';
            document.getElementById('action-controls').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'block';
            setInterval(spawnGlitchText, 900);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isGameStarted) {
                const speed = 0.14;
                if(moveState.w) camera.translateZ(-speed);
                if(moveState.s) camera.translateZ(speed);
                if(moveState.a) camera.translateX(-speed);
                if(moveState.d) camera.translateX(speed);
                
                let px = Math.floor(camera.position.x/CHUNK_SIZE), pz = Math.floor(camera.position.z/CHUNK_SIZE);
                for(let key in chunks) {
                    let [cx, cz] = key.split(',').map(Number);
                    chunks[key].visible = (Math.abs(cx-px) <= RENDER_DISTANCE && Math.abs(cz-pz) <= RENDER_DISTANCE);
                }
                for(let x=px-RENDER_DISTANCE; x<=px+RENDER_DISTANCE; x++) {
                    for(let z=pz-RENDER_DISTANCE; z<=pz+RENDER_DISTANCE; z++) { if(!chunks[`${x},${z}`]) createChunk(x,z); }
                }

                trees.forEach(t => {
                    t.obj.position.x += (Math.random()-0.5)*0.03;
                    if(Date.now() - t.start > 12000) t.obj.scale.multiplyScalar(0.99);
                });

                stalker.lookAt(camera.position);
                if(Math.random() < 0.006) stalker.position.set(camera.position.x + (Math.random()-0.5)*25, 8, camera.position.z + (Math.random()-0.5)*25);

                const ray = new THREE.Raycaster(camera.position, new THREE.Vector3(0,-1,0));
                const hits = ray.intersectObjects(scene.children, true).find(h => h.object !== stalker);
                if(hits && hits.distance < 1.8) { velocity.y = 0; camera.position.y = hits.point.y + 1.8; }
                else { velocity.y -= 0.012; camera.position.y += velocity.y; }
            }
            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
